<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Home</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background-color: #f5f5f5;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 500px;
        }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        .add-btn {
            margin-top: 10px;
            padding: 8px 15px;
            background: #2ecc71;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .form-box {
            margin-top: 15px;
            display: none;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 5px 0;
        }

        .save-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>

    <script>
        function toggleForm() {
            var form = document.getElementById("productForm");
            form.style.display = form.style.display === "none" ? "block" : "none";
        }
    </script>

</head>
<body>

<div class="box">

    <h2>Products</h2>


    <button class="add-btn" onclick="toggleForm()">+ Add Product</button>


    <div id="productForm" class="form-box">
        <form th:action="@{/addProduct}" method="post">

            <input type="text" name="name" placeholder="Name" required><br>
            <input type="number" name="price" placeholder="Price" required><br>
            <input type="number" name="quantity" placeholder="Quantity" required><br>
            <input type="number" name="enable" placeholder="Enable (0 or 1)" required><br>

            <br><br>
            <button type="submit" class="save-btn">Save</button>

        </form>
    </div>

    <table th:if="${products != null and !products.isEmpty()}">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Enable</th>
            <th>EDIT</th>

        </tr>

        <tr th:each="product : ${products}">
            <td th:text="${product.name}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.quantity}"></td>
            <td th:text="${product.enable}"></td>
            <td>
                <a th:href="@{'/product/edit/' + ${product.id}}">Edit</a>
            </td>


        </tr>
    </table>

</div>

</body>
</html>
